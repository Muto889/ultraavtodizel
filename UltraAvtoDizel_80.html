const SB_HDR = {"apikey":SUPABASE_ANON,"Authorization":"Bearer "+SUPABASE_ANON,"Content-Type":"application/json"};

async function sbGet(table){
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*`,{headers:SB_HDR});
  if(!r.ok)throw new Error(`GET ${table}: ${r.status}`);
  return r.json();
}
async function sbUpsert(table,rows){
  if(!rows||rows.length===0)return;
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}`,{
    method:"POST",
    headers:{...SB_HDR,"Prefer":"resolution=merge-duplicates,return=minimal"},
    body:JSON.stringify(rows)
  });
  if(!r.ok)throw new Error(`UPSERT ${table}: ${r.status} ${await r.text()}`);
}
async function sbDelete(table,ids){
  if(!ids||ids.length===0){
    // hamısını sil
    const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=neq.__none__`,{method:"DELETE",headers:SB_HDR});
    if(!r.ok)throw new Error(`DELETE ALL ${table}: ${r.status}`);
    return;
  }
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=not.in.(${ids.join(",")})`,{method:"DELETE",headers:SB_HDR});
  if(!r.ok)throw new Error(`DELETE ${table}: ${r.status}`);
}

// IndexedDB WRAPPER — limitsiz saxlama
// localStorage fallback + köhnə data miqrasiyası
// ════════════════════════════════════════════
const IDB_NAME="UAD_IndexedDB", IDB_VER=1, IDB_STORE="store";
let _idb=null;

function getIDB(){
  if(_idb)return Promise.resolve(_idb);
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>e.target.result.createObjectStore(IDB_STORE);
    req.onsuccess=e=>{_idb=e.target.result;res(_idb);};
    req.onerror=()=>rej(req.error);
  });
}
async function idbGet(key){
  try{const db=await getIDB();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readonly');const r=tx.objectStore(IDB_STORE).get(key);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej(r.error);});}catch{return null;}
}
async function idbSet(key,val){
  try{const db=await getIDB();return new Promise((res,rej)=>{const tx=db.transaction(IDB_STORE,'readwrite');const r=tx.objectStore(IDB_STORE).put(val,key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}catch{}
}

// localStorage-dan IndexedDB-yə bir dəfəlik miqrasiya
async function migrateToIDB(){
  const existing=await idbGet(DATA_KEY);
  if(existing!==null)return; // artıq miqrasiya edilib
  const lsRaw=localStorage.getItem(DATA_KEY);
  if(lsRaw){
    try{
      const parsed=JSON.parse(lsRaw);

    }catch(e){console.warn("Miqrasiya xətası:",e);}
  }else{
    await idbSet(DATA_KEY,[]); // boş başlanğıc
  }
}

const AUTO_BK_KEY="uad_auto_bk_v1";
const MAX_AUTO_BK=7;

async function createAutoBackup(records){
  if(!records||records.length===0)return;
  try{
    const existing=await idbGet(AUTO_BK_KEY)||[];
    const today=new Date().toISOString().slice(0,10);
    if(existing.length>0&&existing[existing.length-1].date===today)return; // bu gün artıq backup var
    existing.push({date:today,count:records.length,data:records});
    const trimmed=existing.slice(-MAX_AUTO_BK);
    await idbSet(AUTO_BK_KEY,trimmed);
    console.log(`✅ Avtomatik yedək: ${records.length} qeydiyyat (${today})`);
  }catch(e){console.warn("Auto backup xətası:",e);}
}

// ════════════════════════════════════════════
// ŞİFRƏ — SHA-256 HASH
// Analiz: crypto.subtle.digest → 32 byte ArrayBuffer → hex string (64 char)
// Fallback: btoa — crypto.subtle olmayan mühitlər üçün
// ════════════════════════════════════════════
async function hashPw(pw){
  try{
    if(crypto&&crypto.subtle){
      const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(pw+"_uad_2024"));
      return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  // Fallback (file:// bəzi brauzerlər)
  return btoa(encodeURIComponent(pw+"_uad_salt_2024")).replace(/[=+/]/g,'x');
}

async function verifyPw(pw,hash){
  const h=await hashPw(pw);
  return h===hash;
}

// Tarix formatlama: YYYY-MM-DD → DD/MM/YYYY
const fmtDate=iso=>{
  if(!iso||iso==="—")return"—";
  const p=iso.split("-");
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso;
};

// Tarix analiz: Excel rəqəmli tarix də daxil (Excel: 1900-dan günlər)
const parseDate=d=>{
  if(!d)return todayISO();
  const s=String(d).trim();
  // DD/MM/YYYY
  if(s.includes("/")){const[dd,mm,yy]=s.split("/");if(yy&&mm&&dd)return`${yy.padStart(4,"20")}-${mm.padStart(2,"0")}-${dd.padStart(2,"0")}`;}
  // YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  // Excel rəqəm (məs: 45678)
  if(/^\d{5}$/.test(s)){
    const d2=new Date((parseInt(s)-25569)*86400000);
    return d2.toISOString().slice(0,10);
  }
  return todayISO();
};

// ════════════════════════════════════════════
const IS={width:"100%",background:C.card,border:"1.5px solid #c8d4e0",borderRadius:8,padding:"11px 13px",color:C.text,fontSize:14,outline:"none",fontFamily:FB,transition:"border-color 0.15s"};
const LS={fontSize:13,fontWeight:800,color:C.navy,letterSpacing:0.5,textTransform:"uppercase",marginBottom:7,display:"block",fontFamily:FB};

function Card({children,style={}}){
  return <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",...style}}>{children}</div>;
}

function Section({num,title,children}){
  return(
    <Card style={{padding:"20px 24px",marginBottom:14,borderLeft:`4px solid ${C.red}`}}>
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:18,paddingBottom:12,borderBottom:`1px solid ${C.border}`}}>
        <span style={{fontFamily:FB,fontSize:11,fontWeight:700,background:C.red,color:"#fff",padding:"3px 8px",borderRadius:5,letterSpacing:1}}>{num}</span>
        <span style={{fontSize:13,fontWeight:700,color:C.textBright,letterSpacing:1.5,textTransform:"uppercase"}}>{title}</span>
      </div>
      {children}
    </Card>
  );
}

const G2=({children})=><div className="g2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>{children}</div>;

function Field({label,value,onChange,type="text",placeholder,warn="",hint="",onKeyDown,phone=false,plate=false,engine=false,min}){
  const[f,setF]=useState(false);
  const[pErr,setPErr]=useState("");
  const delRef=useRef(false);
  // ── Telefon formatı: +994 XX XXX XX XX
  function fmtPh(raw){
    const digs=raw.replace(/\D/g,"");
    const loc0=digs.startsWith("994")?digs.slice(3):digs;
    const loc=loc0.startsWith("0")?loc0.slice(1):loc0;
    const d=loc.slice(0,9);
    if(!d)return "+994 ";
    let r="+994 "+d.slice(0,2);
    if(d.length>2)r+=" "+d.slice(2,5);
    if(d.length>5)r+=" "+d.slice(5,7);
    if(d.length>7)r+=" "+d.slice(7,9);
    return r;
  }
  // ── Nömrə lövhəsi formatı: XX-XX-XXX
  function fmtPlate(raw){
    const c=raw.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
    let d1="",lt="",d2="",i=0;
    while(i<c.length&&d1.length<2&&/\d/.test(c[i]))d1+=c[i++];
    while(i<c.length&&lt.length<2&&/[A-Z]/.test(c[i]))lt+=c[i++];
    while(i<c.length&&d2.length<3&&/\d/.test(c[i]))d2+=c[i++];
    if(d2)return d1+"-"+lt+"-"+d2;
    if(lt)return d1+"-"+lt;
    return d1;
  }
  function plateValid(v){return /^\d{2}-[A-Z]{2}-\d{3}$/.test(v);}
  // ── Mühərrik həcmi formatı: X.X L (məs: 1.6 L, 3.2 L)
  // deleting=true olduqda L avtomatik əlavə edilmir (backspace/delete)
  function fmtEngine(raw,deleting){
    const c=raw.replace(/\s*L$/i,"").replace(/[^0-9.]/g,"");
    const parts=c.split(".");
    const intPart=parts[0].slice(0,2);
    if(parts.length>=2){
      const dec=parts[1].slice(0,1);
      if(dec!=="")return deleting?intPart+"."+dec:intPart+"."+dec+" L";
      return intPart+".";
    }
    return intPart;
  }
  function engineValid(v){return /^\d{1,2}\.\d L$/.test(v);}
  const hasErr=pErr||warn;
  return(
    <div>
      <label style={LS}>{label}</label>
      <input type={type} value={value}
        onChange={e=>{
          if(phone){onChange(fmtPh(e.target.value));}
          else if(plate){const p=fmtPlate(e.target.value);onChange(p);if(pErr&&plateValid(p))setPErr("");}
          else if(engine){const ev=fmtEngine(e.target.value,delRef.current);onChange(ev);if(pErr&&engineValid(ev))setPErr("");delRef.current=false;}
          else{onChange(e.target.value);}
        }}
        placeholder={phone?"+994 XX XXX XX XX":plate?"77-UU-999":engine?"3.2 L":placeholder}
        onKeyDown={e=>{if(engine)delRef.current=(e.key==="Backspace"||e.key==="Delete");if(onKeyDown)onKeyDown(e);}}
        style={{...IS,borderColor:hasErr?C.yellow:f?C.red:"#c8d4e0",boxShadow:f?`0 0 0 3px ${C.redBg}`:"none"}}
        onFocus={()=>{setF(true);if(phone&&!value)onChange("+994 ");}}
        onBlur={()=>{
          setF(false);
          if(phone&&(value==="+994 "||value==="+994"))onChange("");
          if(plate&&value&&!plateValid(value))setPErr("Format yanlışdır — nümunə: 77-UU-999");
          if(plate&&!value)setPErr("");
          if(engine&&value&&!engineValid(value))setPErr("Format yanlışdır — nümunə: 1.6 L, 3.2 L");
          if(engine&&!value)setPErr("");
        }}
        inputMode={phone?"numeric":engine?"decimal":plate?"text":undefined}
        maxLength={phone?17:plate?9:engine?6:undefined}
        autoCapitalize={plate?"characters":undefined}
        min={min}
      />
      {pErr&&!warn&&<div style={{fontSize:12,color:C.yellow,marginTop:5,fontWeight:600}}>⚠️ {pErr}</div>}
      {warn&&<div style={{fontSize:12,color:C.yellow,marginTop:5,fontWeight:600}}>⚠️ {warn}</div>}
      {hint&&!hasErr&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{hint}</div>}
    </div>
  );
}

function Sel({label,value,onChange,options}){
  const[f,setF]=useState(false);
  return(
    <div>
      <label style={LS}>{label}</label>
      <select value={value} onChange={e=>onChange(e.target.value)}
        style={{...IS,borderColor:f?C.red:C.border,boxShadow:f?`0 0 0 3px ${C.redBg}`:"none",cursor:"pointer"}}
        onFocus={()=>setF(true)} onBlur={()=>setF(false)}>
        {!options.includes(value)&&<option value="">Seçin...</option>}
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
    </div>
  );
}

function TA({label,value,onChange,placeholder,rows=3}){
  const[f,setF]=useState(false);
  return(
    <div style={{marginBottom:14}}>
      <label style={LS}>{label}</label>
      <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
        style={{...IS,borderColor:f?C.red:C.border,boxShadow:f?`0 0 0 3px ${C.redBg}`:"none",resize:"vertical"}}
        onFocus={()=>setF(true)} onBlur={()=>setF(false)}/>
    </div>
  );
}

function Tag({label,value,bg,color,border}){
  return <span style={{background:bg,color,border:`1px solid ${border}`,padding:"4px 10px",borderRadius:20,fontSize:12,fontWeight:600,fontFamily:FB}}>{label}: {value}</span>;
}

function IBlock({label,value}){
  if(!value)return null;
  return(<div style={{marginBottom:12}}><div style={{...LS,marginBottom:4}}>{label}</div><div style={{fontSize:14,color:C.text,whiteSpace:"pre-wrap",lineHeight:1.6}}>{value}</div></div>);
}

function StatusBadge({status,onChange}){
  const[open,setOpen]=useState(false);
  const[pos,setPos]=useState({top:0,left:0});
  const btnRef=useRef(null);
  const s=SC[status]||SC["Gözləyir"];
  useEffect(()=>{
    if(!open)return;
    const c=()=>setOpen(false);
    const t=setTimeout(()=>{
      document.addEventListener("click",c,{passive:true});
      document.addEventListener("touchstart",c,{passive:true});
    },150);
    return()=>{clearTimeout(t);document.removeEventListener("click",c);document.removeEventListener("touchstart",c);};
  },[open]);
  const handleOpen=(e)=>{
    e.stopPropagation();
    if(btnRef.current){
      const r=btnRef.current.getBoundingClientRect();
      setPos({top:r.bottom+4,left:r.left});
    }
    setOpen(o=>!o);
  };
  const bs={background:s.bg,color:s.color,border:`1px solid ${s.border}`,padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,fontFamily:FB,letterSpacing:0.3,whiteSpace:"nowrap"};
  if(!onChange)return <span style={bs}>{status||"—"}</span>;
  return(
    <div style={{display:"inline-block"}}
      onClick={e=>e.stopPropagation()}
      onTouchStart={e=>e.stopPropagation()}>
      <button ref={btnRef}
        onClick={handleOpen}
        onTouchEnd={e=>{e.stopPropagation();}}
        style={{...bs,cursor:"pointer",minHeight:36,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:4}}>
        {status||"—"} ▾
      </button>
      {open&&ReactDOM.createPortal(
        <div
          onClick={e=>e.stopPropagation()}
          onTouchStart={e=>e.stopPropagation()}
          style={{position:"fixed",top:pos.top,left:pos.left,zIndex:99999,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.18)",overflow:"hidden",minWidth:180}}>
          {STATUSES.map(st=>{const ss=SC[st];return(
            <div key={st}
              onClick={e=>{e.stopPropagation();onChange(st);setOpen(false);}}
              onTouchEnd={e=>{e.stopPropagation();e.preventDefault();onChange(st);setOpen(false);}}
              style={{padding:"13px 14px",cursor:"pointer",fontSize:13,fontWeight:600,color:st===status?ss.color:C.text,background:st===status?ss.bg:"transparent",borderLeft:st===status?`3px solid ${ss.color}`:"3px solid transparent"}}>
              {st}
            </div>
          );})}
        </div>,
        document.body
      )}
    </div>
  );
}

function IconBtn({onClick,title,color=C.label,children}){
  return(
    <button onClick={onClick} title={title}
      style={{background:"transparent",border:`1.5px solid ${C.border}`,borderRadius:7,width:32,height:32,cursor:"pointer",color,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:14,transition:"all 0.15s"}}
      onMouseEnter={e=>{e.currentTarget.style.borderColor=color;e.currentTarget.style.background=`${color}18`;}}
      onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.background="transparent";}}>
      {children}
    </button>
  );
}

function DelBtn({onClick}){
  return(
    <button onClick={onClick}

// ── Gizli Sual Qurulumu ──
function SecuritySetupModal({onClose}){
  const[step,setStep]=useState(1); // 1=şifrə yoxlama, 2=sual+cavab
  const[pw,setPw]=useState("");
  const[qIdx,setQIdx]=useState(0);
  const[ans,setAns]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const existing=getSecurity();

  const verifyAndNext=async()=>{
    if(!pw)return setErr("Cari şifrəni daxil edin!");
    setLoading(true);
    const ok=await verifyPw(pw,getPass());
    setLoading(false);
    if(ok){setStep(2);setErr("");}
    else setErr("❌ Şifrə yanlışdır!");
  };

  const save=async()=>{
    if(!ans.trim())return setErr("Cavab daxil edin!");
    setLoading(true);
    const h=await hashPw(ans.trim().toLowerCase());
    setSecurity(qIdx,h);
    setLoading(false);
    showToast('Gizli sual uğurla quruldu!','success');
    onClose();
  };

  const IS2=IS;
  const LS2={fontSize:13,fontWeight:800,color:"#1e3a5f",letterSpacing:0.5,textTransform:"uppercase",marginBottom:7,display:"block",fontFamily:FB};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:"26px 28px",maxWidth:400,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>

        <div style={{fontSize:16,fontWeight:800,color:"#0f172a",marginBottom:4,display:"flex",alignItems:"center",gap:8}}>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Gizli Sual {existing?"Dəyiş":"Qur"}
        </div>
        <div style={{fontSize:12,color:"#94a3b8",marginBottom:20}}>
          Şifrəni unutduqda bərpa üçün istifadə olunur
        </div>

        {/* Addım 1: Cari şifrəni yoxla */}
        {step===1&&(
          <>
            <div style={{background:"#eff6ff",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#1d4ed8",marginBottom:16}}>
              Əvvəlcə cari şifrənizi daxil edin
            </div>
            <div style={{marginBottom:18}}>
              <label style={LS2}>Cari Şifrə</label>
              <input type="password" value={pw} onChange={e=>setPw(e.target.value)}
                placeholder="Şifrənizi daxil edin" style={IS2}
                onKeyDown={e=>e.key==="Enter"&&verifyAndNext()} autoFocus/>
            </div>
            {err&&<div style={{color:"#dc2626",fontSize:13,marginBottom:12,textAlign:"center"}}>{err}</div>}
            <div style={{display:"flex",gap:10}}>
              <button onClick={onClose} style={{flex:1,padding:11,borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:600,cursor:"pointer"}}>Ləğv et</button>
              <button onClick={verifyAndNext} disabled={loading} style={{flex:1,padding:11,borderRadius:9,border:"none",background:loading?"#cbd5e1":"#1e3a5f",color:"#fff",fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>
                {loading?"⏳":"→"} Davam et
              </button>
            </div>
          </>
        )}

        {/* Addım 2: Sual seç + cavab yaz */}
        {step===2&&(
          <>
            <div style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,padding:"10px 14px",fontSize:12,color:"#15803d",marginBottom:16}}>
              ✅ Şifrə doğrulandı — indi gizli sualı seçin
            </div>
            <div style={{marginBottom:14}}>
              <label style={LS2}>Gizli Sual</label>
              <select value={qIdx} onChange={e=>setQIdx(Number(e.target.value))} style={{...IS2,cursor:"pointer"}}>
                {SECURITY_QUESTIONS.map((q,i)=><option key={i} value={i}>{q}</option>)}
              </select>
            </div>
            <div style={{marginBottom:6}}>
              <label style={LS2}>Cavabınız</label>
              <input type="text" value={ans} onChange={e=>setAns(e.target.value)}
                placeholder="Cavabı daxil edin..." style={IS2}
                onKeyDown={e=>e.key==="Enter"&&save()}/>
              <div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Böyük/kiçik hərf fərqi yoxdur</div>
            </div>
            {err&&<div style={{color:"#dc2626",fontSize:13,marginBottom:12,textAlign:"center"}}>{err}</div>}
            <div style={{display:"flex",gap:10,marginTop:16}}>
              <button onClick={()=>{setStep(1);setErr("");}} style={{flex:1,padding:11,borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",color:"#64748b",fontWeight:600,cursor:"pointer"}}>← Geri</button>
              <button onClick={save} disabled={loading} style={{flex:1,padding:11,borderRadius:9,border:"none",background:loading?"#cbd5e1":"#dc2626",color:"#fff",fontWeight:700,cursor:loading?"not-allowed":"pointer"}}>
                {loading?"⏳ Gözləyin...":"✅ Saxla"}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ── Usta İdarəetmə Modali (yalnız Sahibkar) ──
function WorkersModal({onClose}){
  const[workers,setWorkers]=useState(()=>loadWorkers());
  const[name,setName]=useState("");
  const[err,setErr]=useState("");

  const add=()=>{
    const n=name.trim();
    if(!n){return setErr("Ad daxil edin!");}
    if(workers.includes(n)){return setErr("Bu ad artıq mövcuddur!");}
    const upd=[...workers,n];
    setWorkers(upd);saveWorkers(upd);setName("");setErr("");
  };
  const remove=n=>{const upd=workers.filter(w=>w!==n);setWorkers(upd);saveWorkers(upd);};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,padding:"24px 26px",maxWidth:420,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:16,fontWeight:800,color:C.textBright,marginBottom:4,display:"flex",alignItems:"center",gap:8}}>
          <span style={{display:"flex",color:C.navy}}>{/*users icon*/}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></span>
          Usta Siyahısı İdarəetmə
        </div>
        <div style={{fontSize:12,color:C.muted,marginBottom:18}}>Ustalar bu siyahıdan seçib giriş edəcək — ad uyğunsuzluğu olmayacaq</div>

        {/* Yeni usta əlavə et */}
        <div style={{display:"flex",gap:8,marginBottom:4}}>
          <input value={name} onChange={e=>setName(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&add()}
            placeholder="Usta adı..."
            style={{...{width:"100%",background:C.card,border:`1.5px solid ${C.border}`,borderRadius:8,padding:"10px 13px",color:C.text,fontSize:14,outline:"none",fontFamily:"'Inter',sans-serif"},flex:1}}/>
          <button onClick={add} style={{padding:"10px 18px",borderRadius:8,border:"none",background:C.navy,color:"#fff",fontWeight:700,fontSize:13,cursor:"pointer",whiteSpace:"nowrap"}}>+ Əlavə et</button>
        </div>
        {err&&<div style={{color:C.red,fontSize:12,marginBottom:10}}>{err}</div>}

        {/* Usta siyahısı */}
        <div style={{marginTop:14,maxHeight:260,overflowY:"auto"}}>
          {workers.length===0?(
            <div style={{textAlign:"center",padding:"24px",color:C.muted,fontSize:13}}>
              Hələ usta əlavə edilməyib.<br/>Yuxarıdan usta adı yazıb əlavə edin.
            </div>
          ):workers.map((w,i)=>(
            <div key={w} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderRadius:9,marginBottom:6,background:C.cardAlt,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:32,height:32,borderRadius:"50%",background:C.navy,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700}}>
                  {w[0].toUpperCase()}
                </div>
                <span style={{fontSize:14,fontWeight:600,color:C.text}}>{w}</span>
              </div>
              <button onClick={()=>remove(w)} style={{padding:"5px 10px",borderRadius:7,border:`1px solid ${C.redBorder}`,background:C.redBg,color:C.red,fontWeight:600,fontSize:12,cursor:"pointer"}}>× Sil</button>
            </div>
          ))}
        </div>

        <button onClick={onClose} style={{marginTop:14,width:"100%",padding:10,borderRadius:9,border:`1.5px solid ${C.border}`,background:C.card,color:C.label,fontWeight:600,cursor:"pointer"}}>Bağla</button>
      </div>
    </div>
  );
}

// ── Zibil Qutusu Modali ──
function TrashModal({records,onPersist,onClose}){
  const[trash,setTr]=useState(()=>cleanTrash());
  const daysSince=dt=>Math.floor((Date.now()-new Date(dt))/864e5);

  const restore=id=>{
    const item=trash.find(r=>r.id===id);
    if(!item)return;
    const{deletedAt,...rest}=item;
    onPersist([...records,rest]);
    const upd=trash.filter(r=>r.id!==id);
    setTr(upd);saveTrash(upd);
  };
  const hardDel=id=>{const upd=trash.filter(r=>r.id!==id);setTr(upd);saveTrash(upd);};
  const emptyAll=()=>{setTr([]);saveTrash([]);};

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,padding:"24px 26px",maxWidth:540,width:"100%",maxHeight:"80vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:C.textBright,display:"flex",alignItems:"center",gap:8}}>
              <span style={{display:"flex",color:C.red}}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></span>
              Zibil Qutusu
              {trash.length>0&&<span style={{background:C.red,color:"#fff",fontSize:11,fontWeight:700,padding:"2px 7px",borderRadius:10}}>{trash.length}</span>}
            </div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Silinən məlumatlar 30 gün saxlanılır</div>
          </div>
          {trash.length>0&&<button onClick={emptyAll} style={{padding:"6px 12px",borderRadius:7,border:`1.5px solid ${C.redBorder}`,background:C.redBg,color:C.red,fontWeight:600,fontSize:12,cursor:"pointer"}}>Hamısını Sil</button>}
        </div>

        <div style={{overflowY:"auto",flex:1}}>
          {trash.length===0?(
            <div style={{textAlign:"center",padding:"36px 20px"}}>
              <div style={{fontSize:36,marginBottom:10,opacity:0.3}}>🗑</div>
              <div style={{fontSize:14,color:C.muted}}>Zibil qutusu boşdur</div>
            </div>
          ):trash.map(r=>{
            const days=daysSince(r.deletedAt);
            const remaining=30-days;
            return(
              <div key={r.id} style={{padding:"12px 14px",borderRadius:10,border:`1px solid ${C.border}`,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,background:C.cardAlt}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontFamily:FM,fontWeight:700,color:C.navy,fontSize:14}}>{r.plate||"—"}</div>
                  <div style={{fontSize:13,color:C.text,marginTop:1}}>{r.name||"—"}{r.phone?<span style={{color:C.muted}}> · {r.phone}</span>:""}</div>
                  <div style={{fontSize:11,marginTop:3,display:"flex",gap:10}}>
                    <span style={{color:C.muted}}>{days} gün əvvəl silindi</span>
                    <span style={{color:remaining<=5?C.red:C.yellow,fontWeight:600}}>{remaining} gün qalır</span>
                  </div>
                </div>
                <div style={{display:"flex",gap:6,flexShrink:0}}>
                  <button onClick={()=>restore(r.id)} style={{padding:"7px 13px",borderRadius:7,border:`1.5px solid ${C.greenBorder}`,background:C.greenBg,color:C.green,fontWeight:700,fontSize:12,cursor:"pointer"}}>↩ Bərpa</button>
                  <button onClick={()=>hardDel(r.id)} style={{padding:"7px 13px",borderRadius:7,border:`1.5px solid ${C.redBorder}`,background:C.redBg,color:C.red,fontWeight:700,fontSize:12,cursor:"pointer"}}>× Həmişəlik Sil</button>
                </div>
              </div>
            );
          })}
        </div>

        <button onClick={onClose} style={{marginTop:14,padding:10,borderRadius:9,border:`1.5px solid ${C.border}`,background:C.card,color:C.label,fontWeight:600,cursor:"pointer"}}>Bağla</button>
      </div>
    </div>
  );
}

// alert() əvəzinə — mobil uyğun, avtomatik kapanır
// ════════════════════════════════════════════
let _globalToast=null;
const showToast=(msg,type='success')=>{if(_globalToast)_globalToast(msg,type);};

const TOAST_CFG={
  success:{bg:'#16a34a',border:'#15803d',icon:'✅'},
  error:  {bg:'#dc2626',border:'#b91c1c',icon:'❌'},
  warning:{bg:'#d97706',border:'#b45309',icon:'⚠️'},
  info:   {bg:'#2563eb',border:'#1d4ed8',icon:'ℹ️'},
};

function ToastContainer({toasts,onRemove}){
  if(!toasts.length)return null;
  return(
    <div style={{position:'fixed',bottom:24,right:20,zIndex:9500,display:'flex',flexDirection:'column',gap:8,maxWidth:340,pointerEvents:'none'}}>
      {toasts.map(t=>{
        const c=TOAST_CFG[t.type]||TOAST_CFG.info;
        return(
          <div key={t.id} style={{background:c.bg,border:`1px solid ${c.border}`,color:'#fff',padding:'12px 16px',borderRadius:12,boxShadow:'0 4px 20px rgba(0,0,0,0.2)',fontSize:13,fontWeight:600,display:'flex',alignItems:'flex-start',gap:10,animation:'toastIn 0.25s ease',pointerEvents:'auto',lineHeight:1.4}}>
            <span style={{fontSize:15,flexShrink:0}}>{c.icon}</span>
            <span style={{flex:1}}>{t.msg}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── Fayl Saxlama Modali — istifadəçi fayl adını dəyişə bilər
function SaveModal({name,ext,blob,onSaved,onClose}){
  const[fname,setFname]=useState(name);
  const isXlsx=ext==="xlsx";
  const hasPicker=typeof window!=="undefined"&&!!window.showSaveFilePicker;
  const doSave=async()=>{
    const raw=(fname||name).trim();
    const filename=raw.endsWith("."+ext)?raw:raw+"."+ext;
    if(hasPicker){
      try{
        const types=isXlsx
          ?[{description:"Excel Faylı (.xlsx)",accept:{"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":[".xlsx"]}}]
          :[{description:"JSON Faylı (.json)",accept:{"application/json":[".json"]}}];
        const fh=await window.showSaveFilePicker({suggestedName:filename,types});
        const ws=await fh.createWritable();
        await ws.write(blob);
        await ws.close();
        onSaved&&onSaved();
        onClose();
        return;
      }catch(e){
        if(e.name==="AbortError")return; // istifadəçi ləğv etdi
        // showSaveFilePicker uğursuz olarsa adi yükləməyə keç
      }
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    onSaved&&onSaved();
    onClose();
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,padding:16}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,padding:"28px 26px",maxWidth:400,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:17,fontWeight:800,color:C.textBright,marginBottom:20}}>
          {isXlsx?"📊 Excel Faylını Saxla":"💾 JSON Yedəkini Saxla"}
        </div>
        <div style={{marginBottom:16}}>
          <label style={LS}>Fayl adı</label>
          <div style={{display:"flex",alignItems:"stretch"}}>
            <input
              value={fname}
              onChange={e=>setFname(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter")doSave();}}
              autoFocus
              style={{...IS,flex:1,borderRadius:"9px 0 0 9px",borderRight:"none",marginBottom:0}}
            />
            <div style={{
              background:"#f1f5f9",border:`1.5px solid #c8d4e0`,borderLeft:"none",
              borderRadius:"0 9px 9px 0",padding:"0 13px",display:"flex",alignItems:"center",
              color:C.muted,fontWeight:700,fontSize:13,whiteSpace:"nowrap",userSelect:"none"
            }}>.{ext}</div>
          </div>
        </div>
        {hasPicker&&(
          <div style={{fontSize:12,color:"#0369a1",background:"#f0f9ff",border:"1px solid #bae6fd",borderRadius:8,padding:"9px 13px",marginBottom:16,lineHeight:1.5}}>
            📁 Düyməyə basanda <b>qovluq seçici</b> açılacaq — istədiyiniz qovluğu seçin
          </div>
        )}
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:13,borderRadius:9,border:`1.5px solid ${C.border}`,background:"#f8fafc",color:"#64748b",fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:FB}}>Ləğv et</button>
          <button onClick={doSave} style={{flex:2,padding:13,borderRadius:9,border:"none",background:isXlsx?C.green:C.navy,color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer",fontFamily:FB,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            {hasPicker
              ?<><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Qovluq seç və saxla</>
              :<><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Yüklə</>
            }
          </button>
        </div>
      </div>
    </div>
  );
}

// GİRİŞ EKRANI — Sahibkar / Usta / Şifrə Sıfırlama
// ════════════════════════════════════════════
function LoginScreen({onLogin}){
  const[mode,setMode]=useState("owner");
  // Owner login
  const[pw,setPw]=useState("");
  const[newPw,setNewPw]=useState("");
  const[cnf,setCnf]=useState("");
  const[show,setShow]=useState(false);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  // Security question setup (first time)
  const[secStep,setSecStep]=useState(false); // true = security sual addımı
  const[secQIdx,setSecQIdx]=useState(0);
  const[secAns,setSecAns]=useState("");
  // Forgot password
  const[forgot,setForgot]=useState(false);
  const[forgotAns,setForgotAns]=useState("");
  const[forgotNew,setForgotNew]=useState("");
  const[forgotCnf,setForgotCnf]=useState("");
  const[forgotStep,setForgotStep]=useState(1); // 1=sual, 2=yeni şifrə
  // Worker
  const[workerName,setWorkerName]=useState("");

  const stored=getPass();
  const security=getSecurity();

  const[cryptoWarn,setCryptoWarn]=useState(false);
  useEffect(()=>{migratePassIfNeeded();},[]);
  useEffect(()=>setErr(""),[mode,forgot]);
  useEffect(()=>{
    if(typeof crypto==="undefined"||!crypto.subtle)setCryptoWarn(true);
  },[]);

  const doLogin=async()=>{
    if(!pw)return setErr("Şifrə daxil edin!");
    setLoading(true);
    const ok=await verifyPw(pw,stored);
    setLoading(false);
    if(ok){onLogin({role:"owner",name:"Sahibkar"});}
    else{setErr("Şifrə yanlışdır. Yenidən cəhd edin.");setPw("");}
  };

  const doSetup=async()=>{
    if(!newPw)return setErr("Şifrə daxil edin!");
    if(newPw.length<4)return setErr("Şifrə ən azı 4 simvol olmalıdır.");
    if(newPw!==cnf)return setErr("Şifrələr bir-birinə uyğun deyil.");
    setLoading(true);
    const hash=await hashPw(newPw);
    setPass(hash);
    setLoading(false);
    setSecStep(true); // şifrə quruldu → indi gizli sual
  };

  const doSetSecurity=async()=>{
    if(!secAns.trim())return setErr("Cavab daxil edin!");
    setLoading(true);
    const h=await hashPw(secAns.trim().toLowerCase());
    setSecurity(secQIdx,h);
    setLoading(false);
    onLogin({role:"owner",name:"Sahibkar"});
  };

  const doForgotCheck=async()=>{
    if(!security)return setErr("Təhlükəsizlik sualı qurulmayıb!");
    if(!forgotAns.trim())return setErr("Cavab daxil edin!");
    setLoading(true);
    const h=await hashPw(forgotAns.trim().toLowerCase());
    setLoading(false);
    if(h===security.hash){setForgotStep(2);setErr("");}
    else setErr("❌ Cavab yanlışdır!");
  };

  const doForgotReset=async()=>{

function App({onLogout, user}){
  const isOwner = user?.role==="owner";
  const isWorker = user?.role==="worker";
  const[tab,setTab]=useState("new");
  const[records,setRecords]=useState([]);
  // ── CANLИ SAAT
  const[now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const AZ_DAYS=["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
  const AZ_MONTHS=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
  const p2=n=>String(n).padStart(2,"0");
  const[form,setForm]=useState(newCust());
  const[saved,setSaved]=useState(false);
  const[saveErr,setSaveErr]=useState("");
  const[dupWarn,setDupWarn]=useState("");
  const[dupPhoneWarn,setDupPhoneWarn]=useState(""); // telefon dublikatı
  const[search,setSearch]=useState("");
  const[searchInput,setSearchInput]=useState(""); // debounce üçün
  const[selCust,setSelCust]=useState(null);
  const[addSvc,setAddSvc]=useState(false);
  const[svc,setSvc]=useState(newSvc());
  const[esId,setEsId]=useState(null);
  const[esD,setEsD]=useState(null);
  const[ec,setEc]=useState(false);
  const[ecD,setEcD]=useState(null);
  const[payId,setPayId]=useState(null);
  const[filt,setFilt]=useState("all");
  const[ustaFilt,setUstaFilt]=useState("all"); // usta filtrı
  const[quick,setQuick]=useState(false);
  const[vw,setVw]=useState("compact");
  const[confirm,setConfirm]=useState(null);
  const[settOpen,setSettOpen]=useState(false);
  const[trashOpen,setTrashOpen]=useState(false);
  const[workersOpen,setWorkersOpen]=useState(false);
  const[securityOpen,setSecurityOpen]=useState(false);
  const[saveFailed,setSaveFailed]=useState(false);
  const[autoSaved,setAutoSaved]=useState(false);
  const[backupWarn,setBackupWarn]=useState(false); // 10 gündən çox yedəklənməyib
  const[dupModal,setDupModal]=useState(null); // {type:'plate'|'phone', existing: record}
  const[toasts,setToasts]=useState([]);
  const[printData,setPrintData]=useState(null);
  const[restoreData,setRestoreData]=useState(null);
  const[saveModal,setSaveModal]=useState(null); // {name,ext,blob,onSaved?}
  const[changePwOpen,setChangePwOpen]=useState(false);
  const[oldPw,setOldPw]=useState("");
  const[newPw1,setNewPw1]=useState("");
  const[newPw2,setNewPw2]=useState("");
  const[pwErr,setPwErr]=useState("");
  const jsonRef=useRef(null);
  const xlsRef=useRef(null);
  const timerRef=useRef(null);

  // Toast sistemi — global əlçatanlıq
  useEffect(()=>{
    _globalToast=(msg,type)=>{
      const id=genId();
      setToasts(p=>[...p,{id,msg,type}]);
      setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3800);
    };
    return()=>{_globalToast=null;};
  },[]);
  useEffect(()=>{
    migrateToIDB().then(()=>loadDataAsync().then(d=>{
      setRecords(d);
      const last=getLastBackup();
      const now=Date.now();
      // 10 gündən çox keçibsə xəbərdarlıq göstər
      if(last&&(now-new Date(last).getTime())>10*86400000){
        setBackupWarn(true);
      }
      // Gündəlik avtomatik yedəkləmə
      if(!last||(now-new Date(last).getTime())>86400000){
        createAutoBackup(d).then(()=>{
          setLastBackup();
          setAutoSaved(true);
          setTimeout(()=>setAutoSaved(false),4000);
        });
      }
    }));
  },[]);

  // Debounce: 300ms gözlə, sonra filter et
  useEffect(()=>{
    const t=setTimeout(()=>setSearch(searchInput),300);
    return()=>clearTimeout(t);
  },[searchInput]);
  useEffect(()=>{
    if(isWorker&&user?.name){
      setForm(f=>({...f,services:[{...f.services[0],usta:"UAD"}]}));
      setSvc(s=>({...s,usta:"UAD"}));
    }
  },[]);

  // ── SESSION TIMEOUT (15 dəq) — yalnız çıxış, xəbərdarlıq yoxdur
  const resetTimer=useCallback(()=>{
    clearTimeout(timerRef.current);
    timerRef.current=setTimeout(()=>{
      onLogout();
    },SESSION_TIMEOUT);
    return()=>{clearTimeout(timerRef.current);};
  },[onLogout]);

  useEffect(()=>{
    const evs=["mousedown","keypress","touchstart","click","scroll"];
    evs.forEach(e=>window.addEventListener(e,resetTimer,true));
    resetTimer();
    return()=>{
      clearTimeout(timerRef.current);
      evs.forEach(e=>window.removeEventListener(e,resetTimer,true));
    };
  },[resetTimer]);

  // ── AYARLAR DROPDOWNi — kənar kliklə/toxunma ilə bağla
  useEffect(()=>{
    if(!settOpen)return;
    const c=(e)=>{setSettOpen(false);};
    const t=setTimeout(()=>{
      document.addEventListener("click",c,{passive:true});
      document.addEventListener("touchstart",c,{passive:true});
    },150);
    return()=>{clearTimeout(t);document.removeEventListener("click",c);document.removeEventListener("touchstart",c);};
  },[settOpen]);

  const ask=(msg,fn)=>setConfirm({msg,fn});

  // ── YEDƏKLƏMƏ TARIXI
  const lastBkp=getLastBackup();
  const daysSinceBkp=lastBkp?Math.floor((Date.now()-new Date(lastBkp))/(1000*60*60*24)):999;
  const needsBkpWarn=records.length>0&&daysSinceBkp>=7;

  // ── useMemo: yalnız lazım olanda hesabla
  // Usta statistikası
  // countBase: ustaFilt + search nəzərə alır, amma filt yox
  // Filtr düymələrinin sayları buna əsaslanır → yanıltıcı deyil
  const countBase=useMemo(()=>{
    let base=records;
    if(isOwner&&ustaFilt!=="all")base=base.filter(r=>r.services.some(sv=>sv.usta===ustaFilt));
    if(search)base=base.filter(r=>
      r.name.toLowerCase().includes(search.toLowerCase())||
      (r.phone||"").includes(search)||
      (r.plate||"").replace(/-/g,"").toUpperCase().includes(search.replace(/-/g,"").toUpperCase())
    );
    return base;
  },[records,ustaFilt,search,isOwner]);

  const counts=useMemo(()=>({
    all:countBase.length,
    debt:countBase.filter(r=>r.services.reduce((a,s)=>a+calcDebt(s),0)>0).length,
    repair:countBase.filter(r=>{const l=r.services[r.services.length-1];return l&&(l.status==="Təmirdə"||l.status==="Gözləyir");}).length,
    ready:countBase.filter(r=>{const l=r.services[r.services.length-1];return l&&l.status==="Hazır";}).length,
  }),[countBase]);

  const filtered=useMemo(()=>{
    return countBase.filter(r=>{
      if(filt==="all")return true;
      const l=r.services[r.services.length-1];
      const td=r.services.reduce((a,s)=>a+calcDebt(s),0);
      if(filt==="debt")return td>0;

  const importExcel=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const rawRows=XLSX.utils.sheet_to_json(ws,{raw:false,dateNF:"dd/mm/yyyy"});
        if(!rawRows.length){showToast('Excel faylında qeydiyyat tapılmadı. Faylı yoxlayın.','warning');return;}
        // Case-insensitive + boşluq normalizasiyası
        const norm=obj=>{const r={};Object.keys(obj).forEach(k=>{r[k.trim().toLowerCase()]=obj[k];});return r;};
        const g=(row,key)=>row[key.toLowerCase()]||row[key]||"";
        const rows=rawRows.map(norm);
        const custMap={};
        rows.forEach(row=>{
          const key=String(g(row,"nömrə")||g(row,"nomre")||"")+String(g(row,"telefon")||"")||genId();
          if(!custMap[key]){
            custMap[key]={id:genId(),
              name:g(row,"müştəri")||g(row,"mustəri")||g(row,"ad")||"",
              phone:String(g(row,"telefon")||""),
              carBrand:g(row,"marka")||g(row,"avtomobil")||"",
              plate:String(g(row,"nömrə")||g(row,"nomre")||""),
              engineModel:g(row,"mühərrik")||g(row,"muherrik")||"",
              fuelSystem:g(row,"yanacaq")||"",
              color:g(row,"rəng")||g(row,"reng")||"",
              services:[]};
          }
          custMap[key].services.push({
            id:genId(),
            date:parseDate(g(row,"tarix")),
            usta:g(row,"usta")||g(row,"təhvil verən")||"UAD",
            mileage:String(g(row,"km")||g(row,"kilometraj")||""),
            complaint:g(row,"şikayət")||g(row,"sikayat")||"",

            status:g(row,"status")||"Gözləyir",

            discount:String(g(row,"endirim")||""),
            paid:String(g(row,"ödənildi")||g(row,"odenildi")||""),
            paymentMethod:g(row,"ödəniş növü")||g(row,"odenis")||"Nağd",
            notes:g(row,"qeyd")||""
          });
        });
        const imported=Object.values(custMap);
        const merged=[...records];
        let added=0;
        imported.forEach(imp=>{
          const ex=merged.find(r=>r.plate&&imp.plate&&r.plate.replace(/-/g,"").toUpperCase()===imp.plate.replace(/-/g,"").toUpperCase());
          if(ex){ex.services.push(...imp.services);}
          else{merged.push(imp);added++;}
        });
        persist(merged);
        showToast(`Excel yükləndi: ${added} yeni müştəri + mövcud xidmətlər əlavə edildi`,'success');
      }catch(err){showToast('Excel faylı oxunmadı. Faylın formatını yoxlayın.','error');}

            {!ec?(
              <Card style={{padding:"20px 24px",marginBottom:16,borderLeft:`4px solid ${C.navy}`}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontFamily:FM,fontSize:24,fontWeight:800,color:C.navy,marginBottom:4}}>{selCust.plate||"—"}</div>
                    <div style={{fontSize:16,fontWeight:700,color:C.text}}>{selCust.name||""}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:14,marginTop:12,fontSize:13,color:"#475569",fontWeight:500}}>
                      {selCust.phone&&<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:C.blue,display:"flex"}}>{Ico.phone}</span>{selCust.phone}</span>}
                      {selCust.carBrand&&<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:C.navy,display:"flex"}}>{Ico.car}</span>{selCust.carBrand}</span>}
                      {selCust.engineModel&&<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:"#64748b",display:"flex"}}>{Ico.engine}</span>{selCust.engineModel}</span>}
                      {selCust.color&&<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:"#8b5cf6",display:"flex"}}>{Ico.paint}</span>{selCust.color}</span>}
                      {selCust.fuelSystem&&<span style={{display:"flex",alignItems:"center",gap:5}}><span style={{color:C.yellow,display:"flex"}}>{Ico.fuel}</span>{selCust.fuelSystem}</span>}
                    </div>
                  </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      <IconBtn onClick={()=>{setEc(true);setEcD({...selCust});}} title="Redaktə et" color={C.blue}>{Ico.pencil}</IconBtn>
                      {isOwner&&<IconBtn onClick={delCust} title="Müştərini sil" color={C.red}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></IconBtn>}
                    </div>
                </div>
              </Card>
            ):(
              <Card style={{padding:"20px 24px",marginBottom:16,border:`2px solid ${C.blue}`}}>
                <div style={{fontSize:12,fontWeight:700,color:C.blue,letterSpacing:1,fontFamily:FB,marginBottom:14}}>✎ MÜŞTƏRİ MƏLUMATLARINI REDAKTƏ ET</div>
                <G2>
                  <Field label="Müştəri Adı" value={ecD.name} onChange={v=>setEcD(d=>({...d,name:v}))}/>
                  <Field label="Telefon" value={ecD.phone} onChange={v=>setEcD(d=>({...d,phone:v}))} phone/>
                  <Field label="Marka / Model" value={ecD.carBrand} onChange={v=>setEcD(d=>({...d,carBrand:v}))}/>
                  <Field label="Dövlət Nömrəsi" value={ecD.plate} onChange={v=>setEcD(d=>({...d,plate:v}))} plate/>
                  <Field label="Mühərrik Həcmi" value={ecD.engineModel} onChange={v=>setEcD(d=>({...d,engineModel:v}))} engine/>
                  <Sel label="Yanacaq Sistemi" value={ecD.fuelSystem} onChange={v=>setEcD(d=>({...d,fuelSystem:v}))} options={FUELS}/>
                  <Field label="Rəng" value={ecD.color} onChange={v=>setEcD(d=>({...d,color:v}))}/>
                </G2>
                <div style={{display:"flex",gap:10,marginTop:16}}>
                  <button onClick={()=>{setEc(false);setEcD(null);}} style={{flex:1,padding:11,borderRadius:9,border:`1.5px solid ${C.border}`,background:C.card,color:C.label,fontWeight:600,cursor:"pointer"}}>Ləğv et</button>
                  <button onClick={saveEditCust} style={{flex:1,padding:11,borderRadius:9,border:"none",background:C.blue,color:"#fff",fontWeight:700,cursor:"pointer"}}>Yadda saxla</button>
                </div>
              </Card>
            )}

            {selCust.services.map((sv,i)=>{
              const d=calcDebt(sv);
              if(esId===sv.id)return <div key={sv.id} style={{marginBottom:12}}><SvcForm data={esD} setData={setEsD} onSave={saveEditSvc} onCancel={()=>{setEsId(null);setEsD(null);}} title={`Xidmət #${String(i+1).padStart(2,"0")} Redaktəsi`}/></div>;
              return(
                <Card key={sv.id} style={{padding:"18px 20px",marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
                      <span style={{background:C.navy,color:"#fff",fontFamily:FB,fontWeight:700,fontSize:11,padding:"3px 8px",borderRadius:5,letterSpacing:1}}>XİDMƏT #{String(i+1).padStart(2,"0")}</span>
                      <span style={{fontSize:13,color:"#475569",fontFamily:FM,fontWeight:600}}>{fmtDate(sv.date)}</span>
                      {sv.usta&&<span style={{fontSize:13,color:"#475569"}}>· <strong style={{color:C.textBright,fontWeight:700}}>{sv.usta}</strong></span>}
                      {sv.mileage&&<span style={{fontSize:12,color:"#334155",fontFamily:FM,fontWeight:700,display:"inline-flex",alignItems:"center",gap:4}}><span style={{color:C.green,display:"flex"}}>{Ico.mileage}</span>{sv.mileage} {sv.mileageUnit||"KM"}</span>}
                    </div>
                    <div className="svc-btns" style={{display:"flex",gap:6,alignItems:"center"}}>
                      <StatusBadge status={sv.status} onChange={st=>updStatus(sv.id,st)}/>
                      {selCust.phone&&(
                        <button onClick={()=>sendWhatsApp(selCust,sv)} title="WhatsApp ilə göndər"
                          style={{background:"transparent",border:"1.5px solid #d1d9e6",borderRadius:7,width:32,height:32,cursor:"pointer",color:"#64748b",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}
                          onMouseEnter={e=>{e.currentTarget.style.borderColor="#25D366";e.currentTarget.style.color="#25D366";e.currentTarget.style.background="#f0fdf4";}}
                          onMouseLeave={e=>{e.currentTarget.style.borderColor="#d1d9e6";e.currentTarget.style.color="#64748b";e.currentTarget.style.background="transparent";}}>
                          {Ico.whatsapp}
                        </button>
                      )}
                      <button onClick={()=>printReceipt(selCust,sv)} title="Qəbz çap et"
                        style={{background:"transparent",border:"1.5px solid #d1d9e6",borderRadius:7,width:32,height:32,cursor:"pointer",color:"#64748b",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.15s"}}
                        onMouseEnter={e=>{e.currentTarget.style.borderColor=C.navy;e.currentTarget.style.color=C.navy;e.currentTarget.style.background=C.blueBg;}}
                        onMouseLeave={e=>{e.currentTarget.style.borderColor="#d1d9e6";e.currentTarget.style.color="#64748b";e.currentTarget.style.background="transparent";}}>
                        {Ico.printer}
                      </button>
                      <IconBtn onClick={()=>{setEsId(sv.id);setEsD({...sv});}} title="Redaktə et" color={C.blue}>{Ico.pencil}</IconBtn>
                      {isOwner&&<IconBtn onClick={()=>delSvc(sv.id)} title="Sil" color={C.red}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg></IconBtn>}
                    </div>
                  </div>
                  <IBlock label="Şikayət" value={sv.complaint}/>
                  <IBlock label="Görülən işlər" value={sv.workDone}/>
                  <IBlock label="Qeyd" value={sv.notes}/>
                  {(sv.amount||sv.discount||sv.paid)&&(
                    <div style={{paddingTop:12,borderTop:`1px solid ${C.border}`}}>
                      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                        {sv.amount&&<Tag label="Məbləğ" value={`${sv.amount} ₼`} bg={C.blueBg} color={C.blue} border={C.blueBorder}/>}
                        {sv.discount&&parseFloat(sv.discount)>0&&<Tag label="Endirim" value={`${sv.discount} ₼`} bg={C.yellowBg} color={C.yellow} border={C.yellowBorder}/>}
                        {sv.paid&&<Tag label="Ödənildi" value={`${sv.paid} ₼`} bg={C.greenBg} color={C.green} border={C.greenBorder}/>}
                        {d>0&&<Tag label="Borc" value={`${d.toFixed(2)} ₼`} bg={C.redBg} color={C.red} border={C.redBorder}/>}
                        {sv.paymentMethod&&<Tag label="Növü" value={sv.paymentMethod} bg={C.cardAlt} color={C.label} border={C.border}/>}
                      </div>
                      {d>0&&<button onClick={()=>setPayId(sv.id)} style={{marginTop:12,padding:"8px 14px",borderRadius:8,border:`1.5px solid ${C.greenBorder}`,background:C.greenBg,color:C.green,fontWeight:600,fontSize:12,cursor:"pointer"}}>+ Borc Ödənişi Əlavə Et</button>}
                    </div>
                  )}
                </Card>
              );
            })}

            {!addSvc?(
              <button onClick={()=>setAddSvc(true)}
                style={{width:"100%",padding:14,borderRadius:10,border:`2px dashed ${C.border}`,background:"transparent",color:C.label,fontWeight:600,fontSize:14,cursor:"pointer",transition:"all 0.15s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=C.red;e.currentTarget.style.color=C.red;}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=C.border;e.currentTarget.style.color=C.label;}}>
                ＋ Yeni Xidmət Əlavə Et
              </button>
            ):(
              <SvcForm data={svc} setData={setSvc} onSave={handleAddSvc} onCancel={()=>{setAddSvc(false);setSvc(newSvc());}} title="Yeni Xidmət"/>
            )}
          </>
        )}
      </div>

      {/* FOOTER */}
      <div style={{textAlign:"center",padding:"14px 20px",borderTop:`1px solid ${C.border}`,background:C.card}}>
        <span style={{fontFamily:FM,fontSize:11,color:C.muted,letterSpacing:3,fontWeight:600}}>POWERED BY B.M.V</span>
      </div>

      {/* MODALS */}
      {payId&&(()=>{const sv=selCust?.services.find(x=>x.id===payId);if(!sv)return null;return<PayModal debt={calcDebt(sv)} onConfirm={a=>addPayment(payId,a)} onCancel={()=>setPayId(null)}/>;})()}
      {quick&&<QuickModal defaultUsta={isWorker?user?.name:""} onSave={handleQuick} onCancel={()=>setQuick(false)}/>}
      {confirm&&<ConfirmModal msg={confirm.msg} onConfirm={confirm.fn} onCancel={()=>setConfirm(null)} type={confirm.type}/>}
      {saveModal&&<SaveModal name={saveModal.name} ext={saveModal.ext} blob={saveModal.blob} onSaved={saveModal.onSaved} onClose={()=>setSaveModal(null)}/>}
      {restoreData&&<RestoreModal data={restoreData} onReplace={doRestoreReplace} onMerge={doRestoreMerge} onCancel={()=>setRestoreData(null)}/>}
      {printData&&<PrintModal cust={printData.cust} sv={printData.sv} onClose={()=>setPrintData(null)}/>}
      {trashOpen&&<TrashModal records={records} onPersist={upd=>{persist(upd);}} onClose={()=>setTrashOpen(false)}/>}
      {workersOpen&&<WorkersModal onClose={()=>setWorkersOpen(false)}/>}
      {securityOpen&&<SecuritySetupModal onClose={()=>setSecurityOpen(false)}/>}

      {/* ŞİFRƏ DƏYİŞMƏ */}
      {changePwOpen&&(
        <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000,padding:16}} onClick={()=>setChangePwOpen(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.card,borderRadius:16,padding:"28px 28px",maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.2)"}}>
            <div style={{fontSize:16,fontWeight:800,color:C.textBright,marginBottom:20}}>🔑 Şifrəni Dəyiş</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <Field label="Köhnə Şifrə" type="password" value={oldPw} onChange={setOldPw} placeholder="Köhnə şifrəniz"/>
              <Field label="Yeni Şifrə" type="password" value={newPw1} onChange={setNewPw1} placeholder="Ən az 4 simvol"/>
              <Field label="Yeni Şifrəni Təsdiqlə" type="password" value={newPw2} onChange={setNewPw2} placeholder="Yenidən daxil edin"/>
            </div>
            {pwErr&&<div style={{color:C.red,fontSize:13,marginTop:12,textAlign:"center"}}>{pwErr}</div>}
            <div style={{display:"flex",gap:10,marginTop:20}}>
              <button onClick={()=>{setChangePwOpen(false);setPwErr("");}} style={{flex:1,padding:12,borderRadius:9,border:`1.5px solid ${C.border}`,background:C.card,color:C.label,fontWeight:600,cursor:"pointer"}}>Ləğv et</button>
              <button onClick={doChangePw} style={{flex:1,padding:12,borderRadius:9,border:"none",background:C.navy,color:"#fff",fontWeight:700,cursor:"pointer"}}>Saxla</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════
// ERROR BOUNDARY — Gözlənilməz xətalara qarşı qoruyucu
// ════════════════════════════════════════════
class ErrorBoundary extends React.Component{
  constructor(props){super(props);this.state={crashed:false,msg:""};}
  static getDerivedStateFromError(e){return{crashed:true,msg:e?.message||"Naməlum xəta"};}
  componentDidCatch(e,info){console.error("UAD Xəta:",e,info);}
  render(){
    if(this.state.crashed)return(
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16,padding:24,textAlign:"center",background:"#f0f4f8"}}>
        <div style={{fontSize:52}}>⚠️</div>
        <div style={{fontSize:20,fontWeight:800,color:"#1e293b"}}>Xəta baş verdi</div>
        <div style={{fontSize:14,color:"#64748b",maxWidth:380,lineHeight:1.6}}>Proqramda gözlənilməz bir problem yarandı. Məlumatlarınız qorunur. Aşağıdakı düyməyə basaraq davam edə bilərsiniz.</div>
        <div style={{fontSize:11,color:"#94a3b8",fontFamily:"monospace",background:"#f1f5f9",padding:"6px 14px",borderRadius:6,maxWidth:360,wordBreak:"break-all"}}>{this.state.msg}</div>
        <button onClick={()=>window.location.reload()} style={{marginTop:8,padding:"11px 32px",borderRadius:9,border:"none",background:"#dc2626",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer"}}>Səhifəni Yenilə</button>
      </div>
    );
    return this.props.children;
  }
}

// ════════════════════════════════════════════
// ROOT — Giriş ekranı + Əsas proqram
// ════════════════════════════════════════════
function Root(){
  const[user,setUser]=useState(null);
  if(!user) return <LoginScreen onLogin={u=>setUser(u)}/>;
  return <App user={user} onLogout={()=>setUser(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><Root/></ErrorBoundary>);
</script>
</body>
